<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>زیردریایی</title>
<style>
  body {
    margin: 0; padding: 0; background-color: #0f172a; display: flex; flex-direction: column;
    align-items: center; justify-content: center; height: 100vh; overflow: hidden;
    font-family: Tahoma, Arial, sans-serif; touch-action: none;
  }
  #game-container { position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
  canvas {
    background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
    border: 4px solid #334155; border-radius: 10px; display: block;
  }
  #ui-layer {
    position: absolute; top: 10px; left: 10px; right: 10px; display: flex;
    justify-content: space-between; color: white; font-weight: bold; font-size: 18px; pointer-events: none;
  }
  #game-over {
    position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none;
    flex-direction: column; align-items: center; justify-content: center; color: white; border-radius: 10px;
  }
  #game-over h2 { margin: 0 0 10px 0; font-size: 28px; color: #ef4444; }
  #restart-btn {
    padding: 10px 20px; background: #10b981; color: white; border: none;
    border-radius: 5px; font-family: inherit; font-size: 16px; cursor: pointer; margin-top: 15px;
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="ui-layer">
    <div>امتیاز: <span id="score">0</span></div>
    <div>جان: <span id="lives">3</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="500"></canvas>
  <div id="game-over">
    <h2>بازی تمام شد!</h2>
    <div>امتیاز شما: <span id="final-score">0</span></div>
    <button id="restart-btn">شروع مجدد</button>
  </div>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let score = 0; let lives = 3; let gameActive = false; let animationId; let lastTime = 0;
  const player = { x: 50, y: canvas.height / 2, width: 40, height: 20, speed: 4, color: '#fbbf24' };
  let enemies = []; let torpedoes = [];
  let keys = {}; let touchY = null; let isTouching = false; let lastFireTime = 0;
  const ENEMY_SPAWN_RATE = 1200; const ENEMY_SPEED = 1.5; let lastEnemySpawn = 0;

  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);
  canvas.addEventListener('touchstart', handleTouch, {passive: false});
  canvas.addEventListener('touchmove', handleTouch, {passive: false});
  canvas.addEventListener('touchend', (e) => { isTouching = false; e.preventDefault(); });
  canvas.addEventListener('mousedown', (e) => { if(gameActive) fireTorpedo(); });

  function handleTouch(e) {
    e.preventDefault(); if (!gameActive) return;
    const rect = canvas.getBoundingClientRect(); const touch = e.touches[0];
    touchY = touch.clientY - rect.top; isTouching = true;
    const touchX = touch.clientX - rect.left;
    if (touchX < 100) fireTorpedo();
  }

  function fireTorpedo() {
    const now = Date.now();
    if (now - lastFireTime > 300) {
      torpedoes.push({ x: player.x + player.width, y: player.y + player.height / 2, width: 15, height: 4, speed: 7 });
      lastFireTime = now;
    }
  }

  function spawnEnemy() {
    const y = Math.random() * (canvas.height - 40) + 20;
    const type = Math.random() > 0.5 ? 'ship' : 'sub';
    enemies.push({
      x: canvas.width, y: y, width: type === 'ship' ? 40 : 30, height: type === 'ship' ? 25 : 15,
      speed: ENEMY_SPEED + (score * 0.05), color: type === 'ship' ? '#ef4444' : '#9333ea',
      type: type, points: type === 'ship' ? 10 : 20
    });
  }

  function resetGame() {
    score = 0; lives = 3; player.y = canvas.height / 2; enemies = []; torpedoes = []; gameActive = true;
    document.getElementById('score').innerText = score;
    document.getElementById('lives').innerText = lives;
    document.getElementById('game-over').style.display = 'none';
    lastTime = performance.now(); lastEnemySpawn = lastTime;
    if (animationId) cancelAnimationFrame(animationId);
    gameLoop(lastTime);
  }

  function gameLoop(timestamp) {
    if (!gameActive) return;
    const dt = timestamp - lastTime; lastTime = timestamp;
    update(dt); draw();
    animationId = requestAnimationFrame(gameLoop);
  }

  function update(dt) {
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
    if (keys['Space']) fireTorpedo();
    if (isTouching && touchY !== null) {
      const diff = touchY - (player.y + player.height / 2);
      player.y += diff * 0.2;
    }
    if (player.y < 0) player.y = 0;
    if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;

    if (performance.now() - lastEnemySpawn > ENEMY_SPAWN_RATE) { spawnEnemy(); lastEnemySpawn = performance.now(); }

    for (let i = torpedoes.length - 1; i >= 0; i--) {
      torpedoes[i].x += torpedoes[i].speed;
      if (torpedoes[i].x > canvas.width) torpedoes.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i]; e.x -= e.speed;
      if (e.x < player.x + player.width && e.x + e.width > player.x && e.y < player.y + player.height && e.y + e.height > player.y) {
        enemies.splice(i, 1); lives--; document.getElementById('lives').innerText = lives;
        if (lives <= 0) endGame();
        continue;
      }
      if (e.x + e.width < 0) { enemies.splice(i, 1); continue; }
      for (let j = torpedoes.length - 1; j >= 0; j--) {
        const t = torpedoes[j];
        if (t.x < e.x + e.width && t.x + t.width > e.x && t.y < e.y + e.height && t.y + t.height > e.y) {
          enemies.splice(i, 1); torpedoes.splice(j, 1); score += e.points;
          document.getElementById('score').innerText = score; break;
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
    for (let i = 0; i < canvas.height; i += 30) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i + 10); ctx.stroke(); }
    ctx.fillStyle = player.color; ctx.beginPath();
    ctx.roundRect(player.x, player.y, player.width, player.height, 10); ctx.fill();
    ctx.fillRect(player.x + 10, player.y - 6, 12, 8);
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x - 8, player.y + 10); ctx.lineTo(player.x, player.y + 20); ctx.fill();
    ctx.fillStyle = '#60a5fa';
    torpedoes.forEach(t => ctx.fillRect(t.x, t.y, t.width, t.height));
    enemies.forEach(e => {
      ctx.fillStyle = e.color;
      if (e.type === 'ship') {
        ctx.beginPath(); ctx.moveTo(e.x, e.y + e.height); ctx.lineTo(e.x + e.width, e.y + e.height);
        ctx.lineTo(e.x + e.width - 10, e.y); ctx.lineTo(e.x + 10, e.y); ctx.fill();
      } else { ctx.beginPath(); ctx.roundRect(e.x, e.y, e.width, e.height, 5); ctx.fill(); }
    });
  }

  function endGame() {
    gameActive = false;
    document.getElementById('final-score').innerText = score;
    document.getElementById('game-over').style.display = 'flex';
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
      this.beginPath(); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this;
    };
  }
  document.getElementById('restart-btn').onclick = resetGame;
  resetGame();
</script>
</body>
</html>
