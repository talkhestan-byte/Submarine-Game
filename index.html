<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#001b70">
<title>زیردریایی</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#00104e;touch-action:none;user-select:none;font-family:Tahoma,Arial,sans-serif}
#game-container{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;top:0;left:0;right:0;height:58px;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;color:white;font-weight:bold;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent)}
.stat{font-size:14px;text-shadow:2px 2px #001044}
#divers{display:flex;gap:3px}
.diver-icon{width:13px;height:9px;background:#55df63}
#oxygen-panel{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:min(43%,320px);height:15px;border:2px solid #ddd;background:#252525;pointer-events:none}
#oxygen-bar{height:100%;width:100%;background:#e8e8e8;transition:background .2s}
#oxygen-label{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);color:white;font-size:12px;font-weight:bold;text-shadow:2px 2px #001044}
#controls{position:absolute;bottom:42px;left:16px;right:16px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
#fire-btn{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:3px solid #f2d44c;background:rgba(15,35,120,.9);color:white;font-size:15px;font-weight:bold;box-shadow:3px 4px 0 #07134d;touch-action:none}
#fire-btn.active{background:#d54b25;transform:scale(.94)}
#joystick-area{pointer-events:auto;width:112px;height:112px;border:3px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(10,35,100,.65);position:relative;touch-action:none}
#joystick-knob{position:absolute;width:47px;height:47px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ead54b;border:3px solid white;box-shadow:2px 3px 0 #17265c;pointer-events:none}
#message{position:absolute;top:70px;left:50%;transform:translateX(-50%);color:#ffeb65;font-size:14px;font-weight:bold;text-shadow:2px 2px #001044;opacity:0;pointer-events:none;white-space:nowrap}
#game-over,#start-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,10,45,.9);color:white;z-index:20}
#game-over{display:none}
.panel{text-align:center;background:#09266f;border:4px solid #f3d85c;padding:25px;width:min(90%,370px);box-shadow:5px 5px #001044}
.panel h1,.panel h2{color:#ffdf55}
.panel p{font-size:14px;line-height:2}
.game-btn{border:2px solid white;padding:12px 23px;font-size:15px;font-weight:bold;background:#e3b52e;color:#10205c;border-radius:4px;margin:5px}
@media(max-height:480px){
 #hud{height:42px}#controls{bottom:28px}
 #joystick-area{width:85px;height:85px}
 #joystick-knob{width:38px;height:38px}
 #fire-btn{width:62px;height:62px}
 #oxygen-panel{bottom:7px;height:12px}
 #oxygen-label{bottom:22px}
}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>

<div id="hud">
 <div class="stat">امتیاز: <span id="score">0</span></div>
 <div class="stat">غواصان: <span id="divers"></span></div>
 <div class="stat">جان: <span id="lives">3</span></div>
</div>
<div id="message"></div>

<div id="controls">
 <button id="fire-btn">شلیک</button>
 <div id="joystick-area"><div id="joystick-knob"></div></div>
</div>

<div id="oxygen-label">OXYGEN</div>
<div id="oxygen-panel"><div id="oxygen-bar"></div></div>

<div id="start-screen">
 <div class="panel">
  <h1>زیردریایی</h1>
  <p>
   زیردریایی را با جوی‌استیک حرکت بده.<br>
   با یک دکمه در جهت حرکت شلیک کن.<br>
   غواصان را نجات بده و اکسیژن را حفظ کن.<br>
   برای شارژ اکسیژن به سطح آب برو.
  </p>
  <button class="game-btn" id="start-btn">شروع بازی</button>
 </div>
</div>

<div id="game-over">
 <div class="panel">
  <h2>بازی تمام شد!</h2>
  <p>امتیاز شما: <span id="final-score">0</span></p>
  <button class="game-btn" id="restart-btn">شروع مجدد</button>
  <button class="game-btn" id="exit-btn">خروج</button>
 </div>
</div>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('gameCanvas');
const ctx=canvas.getContext('2d');

let W=0,H=0,seaLine=0,floorLine=0;
let score=0,lives=3,oxygen=100,savedDivers=0;
let active=false,gameEnded=false;
let lastTime=0,elapsed=0;
let enemyTimer=0,diverTimer=0,fireHeld=false,fireTimer=0;
let joystickActive=false;
let joystickVector={x:0,y:0};
let keyboardVector={x:0,y:0};
let invulnerable=0,respawnTimer=0;
let screenShake=0,messageTimer=0;
let audioCtx=null;
let refillSoundNodes=null;
let boostApplied=false;

let enemies=[],torpedoes=[],enemyTorpedoes=[],divers=[],particles=[];

const CFG={
 acceleration:1150,
 friction:.94,
 maxSpeed:310,
 fireInterval:.22,
 torpedoSpeed:680,
 oxygenDrain:4,
 oxygenRefill:38
};

const player={
 x:70,y:200,vx:0,vy:0,
 width:54,height:25,direction:1
};

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 seaLine=Math.max(65,H*.20);
 floorLine=H-55;
 const topLimit=seaLine-player.height+3;
 player.y=Math.max(topLimit,Math.min(player.y,floorLine-player.height));
 player.x=Math.max(0,Math.min(player.x,W-player.width));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

// ---------- صدا ----------

function initAudio(){
 if(!audioCtx){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC)audioCtx=new AC();
 }
 if(audioCtx?.state==='suspended')audioCtx.resume();
}

function tone(a,b,d,type='square',volume=.07){
 if(!audioCtx)return;
 const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(Math.max(a,1),now);
 osc.frequency.exponentialRampToValueAtTime(Math.max(b,1),now+d);
 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(.001,now+d);
 osc.connect(gain);gain.connect(audioCtx.destination);
 osc.start(now);osc.stop(now+d);
}

function noise(d=.4,v=.2){
 if(!audioCtx)return;
 const length=Math.floor(audioCtx.sampleRate*d);
 const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=audioCtx.createBufferSource();
 const gain=audioCtx.createGain();
 const filter=audioCtx.createBiquadFilter();
 filter.type='lowpass';filter.frequency.value=850;
 gain.gain.setValueAtTime(v,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
 source.buffer=buffer;
 source.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
 source.start();
}

function startRefillSound(){
 if(!audioCtx||refillSoundNodes)return;
 const now=audioCtx.currentTime;

 const osc=audioCtx.createOscillator();
 const oscGain=audioCtx.createGain();
 const filter=audioCtx.createBiquadFilter();
 filter.type='lowpass';
 filter.frequency.value=1100;
 osc.type='sawtooth';
 osc.frequency.setValueAtTime(100,now);
 osc.frequency.linearRampToValueAtTime(210,now+1.2);
 oscGain.gain.value=.025;

 const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;

 const source=audioCtx.createBufferSource();
 const noiseFilter=audioCtx.createBiquadFilter();
 const noiseGain=audioCtx.createGain();
 source.buffer=buffer;
 source.loop=true;
 noiseFilter.type='bandpass';
 noiseFilter.frequency.value=650;
 noiseFilter.Q.value=.6;
 noiseGain.gain.value=.018;

 osc.connect(oscGain);
 oscGain.connect(filter);
 filter.connect(audioCtx.destination);
 source.connect(noiseFilter);
 noiseFilter.connect(noiseGain);
 noiseGain.connect(audioCtx.destination);

 osc.start();
 source.start();

 refillSoundNodes={osc,oscGain,filter,source,noiseGain};
}

function stopRefillSound(){
 if(!refillSoundNodes)return;
 const n=refillSoundNodes;
 const now=audioCtx.currentTime;
 n.oscGain.gain.setTargetAtTime(0,now,.04);
 n.noiseGain.gain.setTargetAtTime(0,now,.04);
 try{
  n.osc.stop(now+.2);
  n.source.stop(now+.2);
 }catch(_){}
 refillSoundNodes=null;
}

function shootSound(){
 tone(800,180,.14,'square',.06);
 tone(130,55,.17,'sawtooth',.035);
}
function explosionSound(){
 noise(.35,.22);tone(160,30,.4,'sawtooth',.13);
}
function playerExplosionSound(){
 noise(.8,.3);tone(100,20,.75,'sawtooth',.18);
 setTimeout(()=>tone(55,15,.5,'square',.12),140);
}
function saveSound(){
 tone(440,880,.2,'sine',.07);
 setTimeout(()=>tone(650,1100,.2,'sine',.06),130);
}
function alarmSound(){tone(850,500,.2,'square',.04)}

// ---------- پیام ----------

function showMessage(text){
 $('message').textContent=text;
 $('message').style.opacity=1;
 messageTimer=1.5;
}

// ---------- کنترل جوی‌استیک ----------

const joystickArea=$('joystick-area');
const knob=$('joystick-knob');

function joystickStart(e){
 e.preventDefault();
 if(!active)return;
 joystickActive=true;
 joystickMove(e);
 try{joystickArea.setPointerCapture(e.pointerId)}catch(_){}
}
function joystickMove(e){
 if(!joystickActive)return;
 e.preventDefault();
 const r=joystickArea.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 const max=r.width*.34;
 const dist=Math.hypot(dx,dy);
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
 joystickVector={x:dx/max,y:dy/max};
 knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
function joystickEnd(){
 joystickActive=false;
 joystickVector={x:0,y:0};
 knob.style.transform='translate(-50%,-50%)';
}
joystickArea.addEventListener('pointerdown',joystickStart);
joystickArea.addEventListener('pointermove',joystickMove);
joystickArea.addEventListener('pointerup',joystickEnd);
joystickArea.addEventListener('pointercancel',joystickEnd);
joystickArea.addEventListener('lostpointercapture',joystickEnd);

// ---------- شلیک ----------

const fireBtn=$('fire-btn');

fireBtn.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(!active)return;
 initAudio();
 fireHeld=true;
 fireTimer=0;
 fireBtn.classList.add('active');
 try{fireBtn.setPointerCapture(e.pointerId)}catch(_){}
});

function releaseFire(){
 fireHeld=false;
 fireBtn.classList.remove('active');
}
fireBtn.addEventListener('pointerup',releaseFire);
fireBtn.addEventListener('pointercancel',releaseFire);
fireBtn.addEventListener('lostpointercapture',releaseFire);

function fireTorpedo(){
 if(!active||respawnTimer>0)return;
 const dir=player.direction;
 torpedoes.push({
  x:dir===1?player.x+player.width:player.x-20,
  y:player.y+player.height/2-3,
  vx:CFG.torpedoSpeed*dir,
  width:20,height:6,life:3,direction:dir
 });
 shootSound();
}

// ---------- ابزارهای ترسیم ----------

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function overlap(a,b){
 return a.x<b.x+b.width&&a.x+a.width>b.x&&
 a.y<b.y+b.height&&a.y+a.height>b.y;
}

// ---------- انفجار ----------

function createExplosion(x,y,c1='#ffdc40',c2='#ff4a20',count=35){
 for(let i=0;i<count;i++){
  const angle=Math.random()*Math.PI*2;
  const speed=45+Math.random()*220;
  particles.push({
   x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
   life:.45+Math.random()*.7,maxLife:1.15,
   size:2+Math.random()*6,
   color:Math.random()>.5?c1:c2
  });
 }
}

// ---------- دشمنان ----------

function spawnEnemy(){
 const r=Math.random();
 const type=r>.90?'ship':r>.74?'mine':'sub';
 const y=type==='ship'
  ?seaLine-28
  :seaLine+55+Math.random()*Math.max(30,floorLine-seaLine-130);

 enemies.push({
  x:W+35,y,type,
  width:type==='ship'?54:type==='mine'?27:46,
  height:type==='mine'?27:23,
  speed:(75+Math.random()*35+Math.min(score/15,80))*(boostApplied?1.2:1),
  fireTimer:1.5+Math.random()*1.5,
  burst:0
 });
}

function spawnDiver(){
 divers.push({
  x:W+35,
  y:seaLine+75+Math.random()*Math.max(20,floorLine-seaLine-130),
  width:36,height:22,
  speed:65+Math.random()*20,
  phase:Math.random()*6.28
 });
}

// ---------- غواص طبیعی‌تر ----------

function drawDiver(d){
 const x=d.x,y=d.y;
 const kick=Math.sin(elapsed*10+d.phase);
 const arm=Math.sin(elapsed*8+d.phase+1)*2.5;

 ctx.save();

 ctx.fillStyle='#e8e8e8';
 ctx.beginPath();
 ctx.roundRect(x+18,y+5,9,12,3);
 ctx.fill();

 rect(x+20,y+3,5,3,'#bfcbd6');

 ctx.fillStyle='#f1f1f1';
 ctx.beginPath();
 ctx.ellipse(x+17,y+11,11,5,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#e9b98e';
 ctx.beginPath();
 ctx.arc(x+5,y+8,5,0,Math.PI*2);
 ctx.fill();

 rect(x+1,y+5,6,4,'#38d9f4');
 rect(x,y+6,2,2,'#ffffff');

 ctx.strokeStyle='#f4f4f4';
 ctx.lineWidth=3.2;
 ctx.lineCap='round';

 ctx.beginPath();
 ctx.moveTo(x+13,y+8);
 ctx.lineTo(x+8,y+5+arm);
 ctx.lineTo(x+3,y+4+arm);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x+15,y+13);
 ctx.lineTo(x+9,y+16-arm);
 ctx.lineTo(x+4,y+15-arm);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x+23,y+10);
 ctx.lineTo(x+29+kick*3,y+6);
 ctx.lineTo(x+35+kick*4,y+4);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x+23,y+13);
 ctx.lineTo(x+29-kick*3,y+18);
 ctx.lineTo(x+35-kick*4,y+20);
 ctx.stroke();

 ctx.strokeStyle='#dcefff';
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(x+33+kick*4,y+4);
 ctx.lineTo(x+37+kick*4,y+2);
 ctx.moveTo(x+33-kick*4,y+20);
 ctx.lineTo(x+37-kick*4,y+22);
 ctx.stroke();

 ctx.restore();
}

// ---------- زیردریایی ----------

function drawSubmarine(x,y,direction,color,animated,phase=0){
 const w=54;
 ctx.save();

 ctx.translate(x+(direction===-1?w:0),y);
 if(direction===-1)ctx.scale(-1,1);

 const bob=animated?Math.sin(elapsed*2.5+phase)*1.2:0;
 const prop=animated?Math.sin(elapsed*22+phase):0;
 ctx.translate(0,bob);

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(5,13);
 ctx.quadraticCurveTo(7,3,20,3);
 ctx.lineTo(42,5);
 ctx.quadraticCurveTo(53,8,53,13);
 ctx.quadraticCurveTo(51,22,39,22);
 ctx.lineTo(15,21);
 ctx.quadraticCurveTo(5,20,5,13);
 ctx.fill();

 rect(16,0,17,6,color);
 rect(20,-4,7,5,color);
 rect(20,20,15,4,color);

 ctx.fillStyle='#55d8f2';
 ctx.beginPath();
 ctx.arc(37,11,3.2,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle='#ffffff';
 ctx.beginPath();
 ctx.arc(36,10,1.2,0,Math.PI*2);
 ctx.fill();

 rect(12,15,24,2,'rgba(80,70,20,.45)');
 rect(9,8,3,8,'rgba(255,255,255,.25)');

 rect(1,8,5,10,color);
 rect(0,5,4,5,color);
 rect(0,16,4,5,color);
 rect(-5,12,5,2,'#c9d5df');

 ctx.save();
 ctx.translate(-7,13);
 ctx.rotate(prop*.8);
 ctx.fillStyle='#f3d64c';
 ctx.beginPath();
 ctx.ellipse(0,-5,2.2,5,0,0,Math.PI*2);
 ctx.ellipse(0,5,2.2,5,0,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle='#ffffff';
 ctx.fillRect(-1.5,-2,3,4);
 ctx.restore();

 ctx.restore();
}

function drawPlayer(){
 if(respawnTimer>0)return;
 if(invulnerable>0&&Math.floor(elapsed*12)%2===0)return;
 const angle=Math.max(-.10,Math.min(.10,player.vy/1100));
 ctx.save();
 ctx.translate(player.x+player.width/2,player.y+player.height/2);
 ctx.rotate(angle);
 drawSubmarine(-player.width/2,-player.height/2,player.direction,'#ead33d',true);
 ctx.restore();
}

function drawEnemy(e){
 if(e.type==='sub'){
  // زیردریایی دشمن رو به چپ است؛ همان جهت حرکت و شلیک
  drawSubmarine(e.x,e.y,-1,'#ffffff',true,e.y);
 }
 if(e.type==='ship'){
  rect(e.x,e.y+10,e.width,9,'#ffffff');
  rect(e.x+7,e.y+5,e.width-14,7,'#ffffff');
  rect(e.x+20,e.y-4,13,10,'#ffffff');
  rect(e.x+23,e.y-11,5,8,'#ffffff');
  rect(e.x+11,e.y+7,4,3,'#9ce8ff');
  rect(e.x+37,e.y+7,4,3,'#9ce8ff');
 }
 if(e.type==='mine'){
  const cx=e.x+e.width/2,cy=e.y+e.height/2;
  rect(cx-10,cy-10,20,20,'#ffffff');
  rect(cx-14,cy-5,28,10,'#ffffff');
  rect(cx-5,cy-14,10,28,'#ffffff');
  rect(cx-3,cy-3,6,6,'#555555');
 }
}

// ---------- محیط ----------

function drawBackground(){
 const g=ctx.createLinearGradient(0,seaLine,0,H);
 g.addColorStop(0,'#00218c');
 g.addColorStop(1,'#00104c');

 rect(0,0,W,H,'#3039b7');
 rect(0,0,W,seaLine,'#3039b7');
 rect(0,seaLine,W,H-seaLine,g);

 ctx.fillStyle='rgba(110,225,255,.28)';
 ctx.fillRect(0,seaLine-8,W,14);
 ctx.fillStyle='#e7fbff';
 ctx.fillRect(0,seaLine-2,W,3);
 ctx.fillStyle='#5bdcff';
 ctx.fillRect(0,seaLine+2,W,2);

 ctx.fillStyle='rgba(255,255,255,.45)';
 for(let x=15;x<W;x+=125){
  ctx.fillRect(x,seaLine-5,32,1);
 }

 ctx.strokeStyle='rgba(130,170,255,.12)';
 ctx.lineWidth=2;
 for(let y=seaLine+35;y<floorLine;y+=55){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y+2);
  ctx.stroke();
 }

 rect(0,floorLine,W,H-floorLine,'#929292');
 rect(0,floorLine-9,W,9,'#08752a');
 for(let x=0;x<W;x+=100)rect(x,floorLine-5,35,5,'#138a35');
}

// ---------- اژدرها ----------

function drawTorpedo(t){
 ctx.save();
 ctx.shadowColor='#b9f3ff';
 ctx.shadowBlur=8;
 rect(t.x,t.y,t.width,t.height,'#ffffff');
 rect(t.x+(t.direction===1?0:t.width-4),t.y+1,4,4,'#6bdcff');
 ctx.restore();

 ctx.fillStyle='rgba(100,210,255,.48)';
 ctx.fillRect(
  t.direction===1?t.x-13:t.x+t.width,
  t.y+2,13,2
 );
}

function drawEnemyTorpedo(t){
 ctx.save();
 ctx.shadowColor='#ffb5a0';
 ctx.shadowBlur=5;

 // بدنه کوچک اژدر
 rect(t.x,t.y,t.width,t.height,'#ffffff');

 // نوک اژدر در سمت چپ
 rect(t.x,t.y,3,t.height,'#ff684d');

 // رد نور باریک پشت اژدر
 ctx.shadowBlur=0;
 ctx.fillStyle='rgba(255,180,150,.45)';
 ctx.fillRect(t.x+t.width,t.y+1,8,1.5);

 ctx.restore();
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
  rect(p.x,p.y,p.size,p.size,p.color);
 }
 ctx.globalAlpha=1;
}

function draw(){
 ctx.save();
 if(screenShake>0){
  ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
 }
 drawBackground();
 divers.forEach(drawDiver);
 enemies.forEach(drawEnemy);
 drawPlayer();
 torpedoes.forEach(drawTorpedo);
 enemyTorpedoes.forEach(drawEnemyTorpedo);
 drawParticles();
 ctx.restore();
}

// ---------- اکسیژن ----------

function isAtSurface(){
 return player.y<=seaLine-player.height+4;
}

function updateOxygen(dt){
 const atSurface=isAtSurface()&&respawnTimer<=0;

 if(atSurface&&oxygen<100){
  const old=oxygen;
  oxygen=Math.min(100,oxygen+CFG.oxygenRefill*dt);
  startRefillSound();

  if(old<99&&oxygen>=99){
   showMessage('اکسیژن کامل شد!');
   stopRefillSound();
  }
 }else{
  stopRefillSound();
  if(!atSurface){
   oxygen=Math.max(0,oxygen-CFG.oxygenDrain*dt);
   if(oxygen<25&&Math.random()<dt*.9)alarmSound();
   if(oxygen<=0)damagePlayer();
  }
 }

 $('oxygen-bar').style.width=oxygen+'%';
 $('oxygen-bar').style.background=
 oxygen<25?'#ed3525':oxygen<50?'#f5a623':'#e8e8e8';
}

// ---------- آسیب ----------

function damagePlayer(){
 if(invulnerable>0||respawnTimer>0||!active)return;

 lives--;
 $('lives').textContent=lives;
 createExplosion(player.x+player.width/2,player.y+player.height/2,'#fff04a','#ff3a19',65);
 playerExplosionSound();
 screenShake=17;
 player.vx=0;player.vy=0;
 oxygen=100;
 stopRefillSound();

 invulnerable=1.8;
 respawnTimer=1.1;
 showMessage('زیردریایی آسیب دید!');

 if(lives<=0)endGame();
}

// ---------- سختی مرحله ----------

function checkDifficulty(){
 if(score>=1000&&!boostApplied){
  boostApplied=true;
  CFG.maxSpeed*=1.2;
  CFG.acceleration*=1.2;
  CFG.torpedoSpeed*=1.2;
  CFG.fireInterval*=.9;
  showMessage('خطر بیشتر شد! سرعت دشمنان افزایش یافت');
  tone(500,1100,.5,'sawtooth',.08);
 }
}

// ---------- به‌روزرسانی ----------

function update(dt){
 elapsed+=dt;

 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0)$('message').style.opacity=0;
 }

 if(invulnerable>0)invulnerable-=dt;

 if(respawnTimer>0){
  respawnTimer-=dt;
  if(respawnTimer<=0&&lives>0){
   player.x=65;
   player.y=seaLine+H*.25;
   player.vx=0;player.vy=0;
  }
 }else{
  let ix=joystickActive?joystickVector.x:0;
  let iy=joystickActive?joystickVector.y:0;

  ix=Math.max(-1,Math.min(1,ix+keyboardVector.x));
  iy=Math.max(-1,Math.min(1,iy+keyboardVector.y));

  const inputLength=Math.hypot(ix,iy);
  if(inputLength>1){ix/=inputLength;iy/=inputLength}

  if(Math.abs(ix)>.08||Math.abs(iy)>.08){
   player.vx+=ix*CFG.acceleration*dt;
   player.vy+=iy*CFG.acceleration*dt;
  }

  if(Math.abs(ix)>.12)player.direction=ix>0?1:-1;

  const friction=Math.pow(CFG.friction,dt*60);
  player.vx*=friction;
  player.vy*=friction;

  const speed=Math.hypot(player.vx,player.vy);
  if(speed>CFG.maxSpeed){
   player.vx=player.vx/speed*CFG.maxSpeed;
   player.vy=player.vy/speed*CFG.maxSpeed;
  }

  if(Math.abs(player.vx)<1)player.vx=0;
  if(Math.abs(player.vy)<1)player.vy=0;

  player.x+=player.vx*dt;
  player.y+=player.vy*dt;

  const topLimit=seaLine-player.height+3;
  if(player.y<topLimit){
   player.y=topLimit;
   player.vy=Math.max(0,player.vy);
  }

  if(player.y>floorLine-player.height-5){
   player.y=floorLine-player.height-5;
   player.vy=Math.min(0,player.vy);
  }

  if(player.x<5){player.x=5;player.vx=Math.max(0,player.vx)}
  if(player.x>W-player.width-5){
   player.x=W-player.width-5;
   player.vx=Math.min(0,player.vx);
  }

  updateOxygen(dt);

  if(fireHeld){
   fireTimer-=dt;
   if(fireTimer<=0){
    fireTorpedo();
    fireTimer=CFG.fireInterval;
   }
  }
 }

 enemyTimer+=dt;
 diverTimer+=dt;

 const enemyInterval=Math.max(.55,1.7-score/16000)*(boostApplied?.8:1);
 if(enemyTimer>enemyInterval){
  spawnEnemy();
  enemyTimer=0;
 }
 if(diverTimer>5.2){
  spawnDiver();
  diverTimer=0;
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vx*=Math.pow(.96,dt*60);
  p.vy*=Math.pow(.96,dt*60);
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }

 // اژدرهای بازیکن
 for(let i=torpedoes.length-1;i>=0;i--){
  const t=torpedoes[i];
  t.x+=t.vx*dt;
  t.life-=dt;
  if(t.x>W+30||t.x<-30||t.life<=0)torpedoes.splice(i,1);
 }

 // اژدرهای دشمن
 for(let i=enemyTorpedoes.length-1;i>=0;i--){
  const t=enemyTorpedoes[i];
  t.x+=t.vx*dt;

  if(t.x+t.width<-30){
   enemyTorpedoes.splice(i,1);
   continue;
  }

  if(respawnTimer<=0&&overlap(t,player)){
   enemyTorpedoes.splice(i,1);
   damagePlayer();
  }
 }

 // غواصان
 for(let i=divers.length-1;i>=0;i--){
  const d=divers[i];
  d.x-=d.speed*dt;
  if(d.x+d.width<0){divers.splice(i,1);continue}

  if(respawnTimer<=0&&overlap(d,player)){
   divers.splice(i,1);
   score+=50;
   savedDivers++;
   saveSound();
   showMessage('غواص نجات پیدا کرد!');
   $('score').textContent=score;
   checkDifficulty();

   if(savedDivers>=6){
    savedDivers=0;
    lives++;
    $('lives').textContent=lives;
    showMessage('یک جان اضافه گرفتی!');
   }
   updateDiverIcons();
  }
 }

 // دشمنان
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];

  // حرکت دشمن به سمت چپ
  e.x-=e.speed*dt;

  if(e.type==='sub'&&score>500){
   e.fireTimer-=dt;

   if(e.fireTimer<=0){
    const enemySpeed=boostApplied?264:220;
    const shots=boostApplied?2:1;

    for(let k=0;k<shots;k++){
     enemyTorpedoes.push({
      // اژدر از جلوی زیردریایی دشمن که رو به چپ است خارج می‌شود
      x:e.x-11,
      y:e.y+e.height/2+(k===0?-4:4),
      vx:-enemySpeed,
      width:11,
      height:3
     });
    }

    e.fireTimer=(2.2+Math.random()*1.5)*(boostApplied?.8:1);
   }
  }

  if(respawnTimer<=0&&overlap(e,player)){
   enemies.splice(i,1);
   damagePlayer();
   continue;
  }

  if(e.x+e.width<-20){
   enemies.splice(i,1);
   continue;
  }

  for(let j=torpedoes.length-1;j>=0;j--){
   if(overlap(torpedoes[j],e)){
    createExplosion(e.x+e.width/2,e.y+e.height/2,'#ffffff','#d6d6d6',30);
    explosionSound();

    score+=e.type==='ship'?25:e.type==='mine'?15:30;
    $('score').textContent=score;
    checkDifficulty();

    enemies.splice(i,1);
    torpedoes.splice(j,1);
    break;
   }
  }
 }

 if(screenShake>0)screenShake=Math.max(0,screenShake-dt*35);
}

// ---------- رابط کاربری ----------

function updateDiverIcons(){
 const box=$('divers');
 box.innerHTML='';
 for(let i=0;i<savedDivers;i++){
  const el=document.createElement('div');
  el.className='diver-icon';
  box.appendChild(el);
 }
}

function resetGame(){
 resize();
 stopRefillSound();

 score=0;lives=3;oxygen=100;savedDivers=0;
 elapsed=0;enemyTimer=0;diverTimer=0;
 fireTimer=0;fireHeld=false;
 boostApplied=false;

 CFG.acceleration=1150;
 CFG.maxSpeed=310;
 CFG.torpedoSpeed=680;
 CFG.fireInterval=.22;

 enemies=[];torpedoes=[];enemyTorpedoes=[];
 divers=[];particles=[];

 player.x=65;
 player.y=seaLine+H*.25;
 player.vx=0;player.vy=0;
 player.direction=1;

 invulnerable=0;respawnTimer=0;screenShake=0;
 keyboardVector={x:0,y:0};

 joystickEnd();
 releaseFire();

 $('score').textContent='0';
 $('lives').textContent='3';
 $('game-over').style.display='none';
 $('start-screen').style.display='none';

 updateDiverIcons();
 $('oxygen-bar').style.width='100%';
 $('oxygen-bar').style.background='#e8e8e8';

 active=true;
 gameEnded=false;
 lastTime=performance.now();

 cancelAnimationFrame(window.gameAnimation);
 window.gameAnimation=requestAnimationFrame(gameLoop);
}

function endGame(){
 if(gameEnded)return;
 gameEnded=true;
 active=false;
 stopRefillSound();
 joystickEnd();
 releaseFire();
 $('final-score').textContent=score;
 $('game-over').style.display='flex';
}

function gameLoop(timestamp){
 if(!active)return;
 let dt=Math.min((timestamp-lastTime)/1000,.033);
 lastTime=timestamp;
 update(dt);
 draw();
 if(active)window.gameAnimation=requestAnimationFrame(gameLoop);
}

// ---------- دکمه‌ها ----------

$('start-btn').addEventListener('click',()=>{
 initAudio();
 tone(450,900,.25,'sine',.06);
 resetGame();
});

$('restart-btn').addEventListener('click',()=>{
 initAudio();
 resetGame();
});

$('exit-btn').addEventListener('click',()=>{
 stopRefillSound();
 if(window.Capacitor?.Plugins?.App){
  window.Capacitor.Plugins.App.exitApp();
 }else{
  $('game-over').style.display='none';
  $('start-screen').style.display='flex';
 }
});

// ---------- صفحه‌کلید ----------

const keysDown=new Set();

window.addEventListener('keydown',e=>{
 if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
 keysDown.add(e.key.toLowerCase());

 keyboardVector.x=
 (keysDown.has('arrowright')||keysDown.has('d')?1:0)-
 (keysDown.has('arrowleft')||keysDown.has('a')?1:0);

 keyboardVector.y=
 (keysDown.has('arrowdown')||keysDown.has('s')?1:0)-
 (keysDown.has('arrowup')||keysDown.has('w')?1:0);

 if(keyboardVector.x!==0)player.direction=keyboardVector.x>0?1:-1;

 if(e.key===' '&&active){
  initAudio();
  fireHeld=true;
  fireTimer=0;
 }
});

window.addEventListener('keyup',e=>{
 keysDown.delete(e.key.toLowerCase());

 keyboardVector.x=
 (keysDown.has('arrowright')||keysDown.has('d')?1:0)-
 (keysDown.has('arrowleft')||keysDown.has('a')?1:0);

 keyboardVector.y=
 (keysDown.has('arrowdown')||keysDown.has('s')?1:0)-
 (keysDown.has('arrowup')||keysDown.has('w')?1:0);

 if(e.key===' ')fireHeld=false;
});

window.addEventListener('blur',()=>{
 keysDown.clear();
 keyboardVector={x:0,y:0};
 releaseFire();
 joystickEnd();
});

document.addEventListener('contextmenu',e=>e.preventDefault());

draw();
</script>
</body>
