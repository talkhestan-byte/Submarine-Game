<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#001b70">
<title>زیردریایی</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#00104e;touch-action:none;user-select:none;font-family:Tahoma,Arial,sans-serif}body{height:100dvh}
#game-container{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#061c59}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:clamp(54px,9vh,82px);display:flex;justify-content:space-between;align-items:center;padding:8px clamp(16px,4vw,34px);color:white;font-weight:bold;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent)}
.stat{font-size:clamp(15px,2.4vh,21px);text-shadow:2px 2px #001044}
#divers{display:flex;gap:3px}
.diver-icon{width:13px;height:9px;background:#55df63}
#oxygen-panel{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);width:min(58%,460px);height:clamp(17px,2.7vh,24px);border:2px solid #ddd;background:#252525;pointer-events:none}
#oxygen-bar{height:100%;width:100%;background:#e8e8e8;transition:background .2s}
#oxygen-label{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 38px);left:50%;transform:translateX(-50%);color:white;font-size:clamp(13px,2vh,17px);font-weight:bold;text-shadow:2px 2px #001044}
#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(62px,10vh,105px));left:clamp(18px,5vw,52px);right:clamp(18px,5vw,52px);display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
#fire-btn{pointer-events:auto;width:clamp(82px,13vh,116px);height:clamp(82px,13vh,116px);border-radius:50%;border:3px solid #f2d44c;background:rgba(15,35,120,.9);color:white;font-size:15px;font-weight:bold;box-shadow:3px 4px 0 #07134d;touch-action:none}
#fire-btn.active{background:#d54b25;transform:scale(.94)}
#joystick-area{pointer-events:auto;width:clamp(116px,18vh,158px);height:clamp(116px,18vh,158px);border:3px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(10,35,100,.65);position:relative;touch-action:none}
#joystick-knob{position:absolute;width:clamp(48px,7vh,66px);height:clamp(48px,7vh,66px);top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ead54b;border:3px solid white;box-shadow:2px 3px 0 #17265c;pointer-events:none}
#message{position:absolute;top:70px;left:50%;transform:translateX(-50%);color:#ffeb65;font-size:14px;font-weight:bold;text-shadow:2px 2px #001044;opacity:0;pointer-events:none;white-space:nowrap}
#game-over,#start-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,10,45,.9);color:white;z-index:20}
#game-over{display:none}
.panel{text-align:center;background:#09266f;border:4px solid #f3d85c;padding:25px;width:min(90%,370px);box-shadow:5px 5px #001044}
.panel h1,.panel h2{color:#ffdf55}
.panel p{font-size:14px;line-height:2}
.game-btn{border:2px solid white;padding:12px 23px;font-size:15px;font-weight:bold;background:#e3b52e;color:#10205c;border-radius:4px;margin:5px}
@media(max-height:480px){
 #hud{height:42px}#controls{bottom:28px}
 #joystick-area{width:85px;height:85px}
 #joystick-knob{width:38px;height:38px}
 #fire-btn{width:62px;height:62px}
 #oxygen-panel{bottom:7px;height:12px}
 #oxygen-label{bottom:22px}
}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>

<div id="hud">
 <div class="stat">SCORE: <span id="score">0</span></div>
 <div class="stat">DIVERS: <span id="divers"></span></div>
 <div class="stat">LIVES: <span id="lives">3</span></div>
</div>
<div id="message"></div>

<div id="controls">
 <button id="fire-btn">شلیک</button>
 <div id="joystick-area"><div id="joystick-knob"></div></div>
</div>

<div id="oxygen-label">OXYGEN</div>
<div id="oxygen-panel"><div id="oxygen-bar"></div></div>

<div id="start-screen">
 <div class="panel">
  <h1>SUBMARINE RESCUE</h1>
  <p>
   Move with the joystick.<br>
   Fire in the direction you are moving.<br>
   Rescue divers and manage your oxygen.<br>
   Return to the surface to refill oxygen.
  </p>
  <button class="game-btn" id="start-btn">START GAME</button>
 </div>
</div>

<div id="game-over">
 <div class="panel">
  <h2>GAME OVER</h2>
  <p>YOUR SCORE: <span id="final-score">0</span></p>
  <button class="game-btn" id="restart-btn">PLAY AGAIN</button>
  <button class="game-btn" id="exit-btn">EXIT</button>
 </div>
</div>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('gameCanvas');
const ctx=canvas.getContext('2d');

let W=0,H=0,seaLine=0,floorLine=0;
let score=0,lives=3,oxygen=100,savedDivers=0;
let active=false,gameEnded=false;
let lastTime=0,elapsed=0;
let enemyTimer=0,diverTimer=0,enemyDirection=-1,fireHeld=false,fireTimer=0;
let joystickActive=false;
let joystickVector={x:0,y:0};
let keyboardVector={x:0,y:0};
let invulnerable=0,respawnTimer=0;
let screenShake=0,messageTimer=0;
let audioCtx=null;
let alarmTimer=0;
let oxygenEmptyPlayed=false;
let refillSoundNodes=null;
let boostApplied=false;

let enemies=[],torpedoes=[],enemyShots=[],divers=[],particles=[];

const CFG={
 acceleration:820,
 friction:.92,
 maxSpeed:225,
 fireInterval:.30,
 torpedoSpeed:610,
 oxygenDrain:3.2,
 oxygenRefill:38
};

const player={
 x:70,y:200,vx:0,vy:0,
 width:42,height:18,direction:1
};

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 seaLine=Math.max(65,H*.20);
 floorLine=H-55;
 const topLimit=seaLine-player.height+3;
 player.y=Math.max(topLimit,Math.min(player.y,floorLine-player.height));
 player.x=Math.max(0,Math.min(player.x,W-player.width));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

// ---------- صدا ----------

function initAudio(){
 if(!audioCtx){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC)audioCtx=new AC();
 }
 if(audioCtx?.state==='suspended')audioCtx.resume();
}

function tone(a,b,d,type='square',volume=.07){
 if(!audioCtx)return;
 const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(Math.max(a,1),now);
 osc.frequency.exponentialRampToValueAtTime(Math.max(b,1),now+d);
 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(.001,now+d);
 osc.connect(gain);gain.connect(audioCtx.destination);
 osc.start(now);osc.stop(now+d);
}

function noise(d=.4,v=.2){
 if(!audioCtx)return;
 const length=Math.floor(audioCtx.sampleRate*d);
 const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=audioCtx.createBufferSource();
 const gain=audioCtx.createGain();
 const filter=audioCtx.createBiquadFilter();
 filter.type='lowpass';filter.frequency.value=850;
 gain.gain.setValueAtTime(v,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
 source.buffer=buffer;
 source.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
 source.start();
}

function startRefillSound(){
 if(!audioCtx||refillSoundNodes)return;
 const now=audioCtx.currentTime;

 const osc=audioCtx.createOscillator();
 const oscGain=audioCtx.createGain();
 const filter=audioCtx.createBiquadFilter();
 filter.type='lowpass';
 filter.frequency.value=1100;
 osc.type='triangle';
 osc.frequency.setValueAtTime(180,now);
 osc.frequency.linearRampToValueAtTime(420,now+1.2);
 oscGain.gain.value=.085;

 const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;

 const source=audioCtx.createBufferSource();
 const noiseFilter=audioCtx.createBiquadFilter();
 const noiseGain=audioCtx.createGain();
 source.buffer=buffer;
 source.loop=true;
 noiseFilter.type='bandpass';
 noiseFilter.frequency.value=1050;
 noiseFilter.Q.value=.8;
 noiseGain.gain.value=.075;

 osc.connect(oscGain);
 oscGain.connect(filter);
 filter.connect(audioCtx.destination);
 source.connect(noiseFilter);
 noiseFilter.connect(noiseGain);
 noiseGain.connect(audioCtx.destination);

 osc.start();
 source.start();

 refillSoundNodes={osc,oscGain,filter,source,noiseGain};
}

function stopRefillSound(){
 if(!refillSoundNodes)return;
 const n=refillSoundNodes;
 const now=audioCtx.currentTime;
 n.oscGain.gain.setTargetAtTime(0,now,.04);
 n.noiseGain.gain.setTargetAtTime(0,now,.04);
 try{
  n.osc.stop(now+.2);
  n.source.stop(now+.2);
 }catch(_){}
 refillSoundNodes=null;
}

function shootSound(){
 tone(920,130,.19,'square',.11);
 tone(190,42,.24,'sawtooth',.085);
 noise(.12,.07);
}
function explosionSound(){
 noise(.55,.34);tone(190,24,.55,'sawtooth',.2);
 tone(85,28,.42,'triangle',.13);
}
function playerExplosionSound(){
 noise(.8,.3);tone(100,20,.75,'sawtooth',.18);
 setTimeout(()=>tone(55,15,.5,'square',.12),140);
}
function saveSound(){
 tone(520,1050,.22,'sine',.12);
 setTimeout(()=>tone(760,1350,.25,'sine',.11),150);
 noise(.12,.035);
}
function alarmSound(){
 if(!audioCtx)return;
 tone(660,520,.32,'sine',.075);
 setTimeout(()=>tone(520,660,.32,'sine',.075),360);
}

function oxygenEmptySound(){
 if(!audioCtx)return;
 const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 const filter=audioCtx.createBiquadFilter();
 osc.type='sine';
 osc.frequency.setValueAtTime(240,now);
 osc.frequency.exponentialRampToValueAtTime(72,now+1.15);
 filter.type='lowpass';filter.frequency.setValueAtTime(520,now);
 filter.frequency.exponentialRampToValueAtTime(150,now+1.1);
 gain.gain.setValueAtTime(.001,now);
 gain.gain.linearRampToValueAtTime(.18,now+.12);
 gain.gain.exponentialRampToValueAtTime(.001,now+1.25);
 osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
 osc.start(now);osc.stop(now+1.3);
 noise(.65,.045);
}

// ---------- پیام ----------

function showMessage(text){
 $('message').textContent=text;
 $('message').style.opacity=1;
 messageTimer=1.5;
}

// ---------- کنترل جوی‌استیک ----------

const joystickArea=$('joystick-area');
const knob=$('joystick-knob');

function joystickStart(e){
 e.preventDefault();
 if(!active)return;
 joystickActive=true;
 joystickMove(e);
 try{joystickArea.setPointerCapture(e.pointerId)}catch(_){}
}
function joystickMove(e){
 if(!joystickActive)return;
 e.preventDefault();
 const r=joystickArea.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 const max=r.width*.34;
 const dist=Math.hypot(dx,dy);
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
 joystickVector={x:dx/max,y:dy/max};
 knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
function joystickEnd(){
 joystickActive=false;
 joystickVector={x:0,y:0};
 knob.style.transform='translate(-50%,-50%)';
}
joystickArea.addEventListener('pointerdown',joystickStart);
joystickArea.addEventListener('pointermove',joystickMove);
joystickArea.addEventListener('pointerup',joystickEnd);
joystickArea.addEventListener('pointercancel',joystickEnd);
joystickArea.addEventListener('lostpointercapture',joystickEnd);

// ---------- شلیک ----------

const fireBtn=$('fire-btn');

fireBtn.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(!active)return;
 initAudio();
 fireHeld=true;
 fireTimer=0;
 fireBtn.classList.add('active');
 try{fireBtn.setPointerCapture(e.pointerId)}catch(_){}
});

function releaseFire(){
 fireHeld=false;
 fireBtn.classList.remove('active');
}
fireBtn.addEventListener('pointerup',releaseFire);
fireBtn.addEventListener('pointercancel',releaseFire);
fireBtn.addEventListener('lostpointercapture',releaseFire);

function fireTorpedo(){
 if(!active||respawnTimer>0)return;
 const dir=player.direction;
 torpedoes.push({
  x:dir===1?player.x+player.width:player.x-20,
  y:player.y+player.height/2-3,
  vx:CFG.torpedoSpeed*dir,
  width:20,height:6,life:3,direction:dir
 });
 shootSound();
}

// ---------- ابزارهای ترسیم ----------

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function overlap(a,b){
 // جعبه برخورد زیردریایی از تصویر کوچک‌تر است تا انفجار فقط در تماس نزدیک رخ دهد.
 const insetA=a===player?{x:a.x+9,y:a.y+3,width:a.width-17,height:a.height-6}:a;
 const insetB=b===player?{x:b.x+9,y:b.y+3,width:b.width-17,height:b.height-6}:b;
 return insetA.x<insetB.x+insetB.width&&insetA.x+insetA.width>insetB.x&&
 insetA.y<insetB.y+insetB.height&&insetA.y+insetA.height>insetB.y;
}

// ---------- انفجار ----------

function createExplosion(x,y,c1='#ffdc40',c2='#ff4a20',count=35){
 for(let i=0;i<count;i++){
  const angle=Math.random()*Math.PI*2;
  const speed=45+Math.random()*220;
  particles.push({
   x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
   life:.45+Math.random()*.7,maxLife:1.15,
   size:2+Math.random()*6,
   color:Math.random()>.5?c1:c2
  });
 }
}

// ---------- دشمنان ----------

function spawnEnemy(){
 const direction=score>=2000?enemyDirection:-1;
 if(score>=2000)enemyDirection*=-1;
 const type=Math.random()>.76?'ship':'sub';
 const variant=Math.floor(Math.random()*3);
 const width=type==='ship'?62:(variant===0?72:variant===1?64:58);
 const height=type==='ship'?25:(variant===0?28:variant===1?24:22);
 const y=type==='ship'?seaLine-28:seaLine+55+Math.random()*Math.max(30,floorLine-seaLine-130);
 enemies.push({
  x:direction===-1?W+width+24:-width-24,
  y,type,variant,direction,width,height,
  speed:(52+Math.random()*24+Math.min(score/45,28))*(boostApplied?1.10:1),
  fireCooldown:1.2+Math.random()*2.2
 });
}

function spawnDiver(){
 divers.push({
  x:W+35,
  y:seaLine+75+Math.random()*Math.max(20,floorLine-seaLine-130),
  width:36,height:22,
  speed:65+Math.random()*20,
  phase:Math.random()*6.28
 });
}


// ---------- غواص طبیعی‌تر ----------

function drawDiver(d){
 const x=d.x,y=d.y;
 const kick=Math.sin(elapsed*8+d.phase);
 const stroke=Math.sin(elapsed*5+d.phase)*1.5;
 ctx.save();
 // غواص با لباس غواصی، کپسول، ماسک و فین‌های متحرک
 ctx.translate(x,y);
 ctx.lineCap='round';
 ctx.lineJoin='round';
 // کپسول اکسیژن روی پشت
 const tank=ctx.createLinearGradient(13,4,22,18);
 tank.addColorStop(0,'#d9e7ec');tank.addColorStop(.45,'#758b99');tank.addColorStop(1,'#344e62');
 ctx.fillStyle=tank;ctx.beginPath();ctx.roundRect(12,4,8,15,3);ctx.fill();
 ctx.fillStyle='#d6e2e8';ctx.fillRect(14,2,4,3);
 // تنه و لباس غواصی
 const suit=ctx.createLinearGradient(7,5,13,18);
 suit.addColorStop(0,'#263d55');suit.addColorStop(.5,'#087d9b');suit.addColorStop(1,'#12324e');
 ctx.fillStyle=suit;ctx.beginPath();ctx.ellipse(16,11,11,5.3,-.05,0,Math.PI*2);ctx.fill();
 // سر و کلاه
 ctx.fillStyle='#d8b18c';ctx.beginPath();ctx.arc(3,8,5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#182c43';ctx.beginPath();ctx.arc(3,6,5,Math.PI,Math.PI*2);ctx.fill();
 // ماسک شیشه‌ای و بند
 ctx.fillStyle='#43d8ef';ctx.beginPath();ctx.roundRect(-2,5,7,4,1.5);ctx.fill();
 ctx.strokeStyle='#dceef4';ctx.lineWidth=1;ctx.strokeRect(-2,5,7,4);
 ctx.strokeStyle='#263b50';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-1,5);ctx.lineTo(-3,4);ctx.stroke();
 // بازوها با حرکت ملایم شنا
 ctx.strokeStyle='#d5b18f';ctx.lineWidth=3.2;
 ctx.beginPath();ctx.moveTo(11,8);ctx.quadraticCurveTo(7,5+stroke,5,3+stroke);ctx.stroke();
 ctx.beginPath();ctx.moveTo(12,14);ctx.quadraticCurveTo(8,17-stroke,5,15-stroke);ctx.stroke();
 // پاها و فین‌های پهن
 ctx.strokeStyle='#173a57';ctx.lineWidth=3.8;
 ctx.beginPath();ctx.moveTo(23,9);ctx.quadraticCurveTo(29,7+kick*2,33,5+kick*3);ctx.stroke();
 ctx.beginPath();ctx.moveTo(23,13);ctx.quadraticCurveTo(29,16-kick*2,33,18-kick*3);ctx.stroke();
 ctx.fillStyle='#f0b82e';
 ctx.beginPath();ctx.moveTo(31,3+kick*3);ctx.quadraticCurveTo(37,1+kick*3,40,4+kick*3);ctx.lineTo(34,8+kick*3);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(31,17-kick*3);ctx.quadraticCurveTo(37,20-kick*3,40,17-kick*3);ctx.lineTo(34,13-kick*3);ctx.closePath();ctx.fill();
 // رگولاتور و حباب‌های کوچک
 ctx.strokeStyle='#d4e6ec';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(9,8);ctx.quadraticCurveTo(7,12,9,15);ctx.stroke();
 ctx.restore();
}

// ---------- زیردریایی ----------

function drawSubmarine(x,y,direction,color,animated,phase=0){
 const w=44;
 ctx.save();
 ctx.translate(x+(direction===-1?w:0),y);
 if(direction===-1)ctx.scale(-1,1);
 ctx.scale(.82,1);
 const bob=animated?Math.sin(elapsed*2.5+phase)*1.2:0;
 ctx.translate(0,bob);
 ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(4,5);ctx.lineTo(39,5);ctx.lineTo(44,9);ctx.lineTo(44,17);
 ctx.lineTo(39,21);ctx.lineTo(4,21);ctx.lineTo(1,17);ctx.lineTo(1,9);ctx.closePath();ctx.fill();
 rect(15,0,17,6,color);rect(20,-4,7,5,color);rect(18,20,15,3,color);
 ctx.fillStyle='#55d8f2';ctx.beginPath();ctx.arc(37,11,3.2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(36,10,1.2,0,Math.PI*2);ctx.fill();
 rect(12,15,24,2,'rgba(80,70,20,.45)');rect(9,8,3,8,'rgba(255,255,255,.25)');
 rect(1,8,5,10,color);rect(0,5,4,5,color);rect(0,16,4,5,color);rect(-5,12,5,2,'#c9d5df');
 ctx.save();ctx.translate(-7,13);ctx.rotate(elapsed*24+phase);ctx.fillStyle='#f3d64c';ctx.beginPath();
 for(let k=0;k<3;k++){ctx.rotate(Math.PI*2/3);ctx.ellipse(0,-5,2.4,6.5,0,0,Math.PI*2)}
 ctx.fill();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,0,2.3,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.restore();
}

function drawEnemySubmarine(e){
 ctx.save();
 ctx.translate(e.x+(e.direction===-1?e.width:0),e.y);
 if(e.direction===-1)ctx.scale(-1,1);
 ctx.translate(0,Math.sin(elapsed*2.1+e.y)*1.1);
 const hull=e.variant===0?'#8795a7':e.variant===1?'#536c82':'#9b7655';
 const dark=e.variant===0?'#34465c':e.variant===1?'#1d354c':'#51402f';
 const light=e.variant===0?'#c5d0d9':e.variant===1?'#8ca7b8':'#d2b18a';
 if(e.variant===0){
  ctx.fillStyle=hull;ctx.beginPath();ctx.moveTo(2,14);ctx.lineTo(12,5);ctx.lineTo(58,5);ctx.lineTo(70,12);ctx.lineTo(58,22);ctx.lineTo(12,22);ctx.closePath();ctx.fill();
  rect(24,1,18,5,dark);rect(30,-4,7,5,dark);rect(46,3,9,3,light);rect(15,22,35,3,dark);rect(6,12,5,4,light);
 }else if(e.variant===1){
  ctx.fillStyle=hull;ctx.beginPath();ctx.moveTo(1,13);ctx.lineTo(17,3);ctx.lineTo(49,7);ctx.lineTo(63,13);ctx.lineTo(48,20);ctx.lineTo(17,24);ctx.closePath();ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(21,4);ctx.lineTo(34,-5);ctx.lineTo(43,5);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(18,21);ctx.lineTo(8,29);ctx.lineTo(37,22);ctx.closePath();ctx.fill();rect(47,9,8,7,light);rect(10,12,7,3,dark);
 }else{
  ctx.fillStyle=hull;ctx.beginPath();ctx.moveTo(2,10);ctx.lineTo(12,4);ctx.lineTo(46,4);ctx.lineTo(58,10);ctx.lineTo(55,21);ctx.lineTo(9,21);ctx.closePath();ctx.fill();
  rect(17,0,12,6,dark);rect(34,1,11,5,dark);rect(20,-4,5,5,light);rect(37,-3,5,4,light);
  rect(4,22,15,4,dark);rect(38,22,15,4,dark);rect(48,11,5,4,light);
 }
 rect(12,12,5,3,'#bce8ef');rect(23,12,5,3,'#bce8ef');rect(34,12,5,3,'#bce8ef');
 ctx.restore();
}

function drawPlayer(){
 if(respawnTimer>0)return;
 if(invulnerable>0&&Math.floor(elapsed*12)%2===0)return;
 const angle=Math.max(-.10,Math.min(.10,player.vy/1100));
 ctx.save();
 ctx.translate(player.x+player.width/2,player.y+player.height/2);
 ctx.rotate(angle);
 drawSubmarine(-player.width/2,-player.height/2,player.direction,'#ead33d',true);
 ctx.restore();
}

function drawEnemyShot(t){
 ctx.save();
 ctx.translate(t.x,t.y);
 ctx.rotate(Math.atan2(t.vy,t.vx));
 ctx.shadowColor='#ff8a32';ctx.shadowBlur=10;
 ctx.fillStyle='#ffb044';
 ctx.beginPath();ctx.roundRect(-9,-4,18,8,3);ctx.fill();
 ctx.fillStyle='#fff1b8';ctx.fillRect(-5,-2,8,3);
 ctx.restore();
}

function drawEnemy(e){
 if(e.type==='sub')drawEnemySubmarine(e);
 else if(e.type==='ship'){
  ctx.save();ctx.translate(e.x+(e.direction===-1?e.width:0),e.y);
  if(e.direction===-1)ctx.scale(-1,1);
  rect(0,10,e.width,10,'#d7e0e8');rect(8,5,e.width-18,7,'#71889a');
  rect(20,-4,15,10,'#536879');rect(24,-11,6,8,'#d8e1e8');
  rect(12,7,4,3,'#9ce8ff');rect(42,7,4,3,'#9ce8ff');ctx.restore();
 }
}

// ---------- محیط ----------

function drawBackground(){
 const g=ctx.createLinearGradient(0,seaLine,0,H);
 g.addColorStop(0,'#087fc2');
 g.addColorStop(.38,'#07528f');
 g.addColorStop(1,'#031b4c');

 const sky=ctx.createLinearGradient(0,0,0,seaLine);
 sky.addColorStop(0,'#4e9fe8');sky.addColorStop(1,'#b4e8f3');
 rect(0,0,W,H,'#031b4c');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,seaLine);
 rect(0,seaLine,W,H-seaLine,g);

 ctx.fillStyle='rgba(110,225,255,.28)';
 ctx.fillRect(0,seaLine-8,W,14);
 ctx.fillStyle='#e7fbff';
 ctx.fillRect(0,seaLine-2,W,3);
 ctx.fillStyle='#5bdcff';
 ctx.fillRect(0,seaLine+2,W,2);

 ctx.fillStyle='rgba(255,255,255,.58)';
 for(let x=15;x<W;x+=125){ctx.fillRect(x,seaLine-5,48,2);}
 // پرتوهای نور که از سطح آب به عمق می‌رسند
 ctx.save();ctx.globalAlpha=.10;ctx.fillStyle='#9beaff';
 for(let x=-80;x<W;x+=190){ctx.beginPath();ctx.moveTo(x,seaLine+5);ctx.lineTo(x+35,seaLine+5);ctx.lineTo(x+125,floorLine);ctx.lineTo(x+70,floorLine);ctx.closePath();ctx.fill();}
 ctx.restore();


 rect(0,floorLine,W,H-floorLine,'#929292');
 rect(0,floorLine-9,W,9,'#08752a');
 for(let x=0;x<W;x+=100)rect(x,floorLine-5,35,5,'#138a35');
}

// ---------- اژدرها ----------

function drawTorpedo(t){
 ctx.save();
 ctx.shadowColor='#b9f3ff';
 ctx.shadowBlur=8;
 rect(t.x,t.y,t.width,t.height,'#ffffff');
 rect(t.x+(t.direction===1?0:t.width-4),t.y+1,4,4,'#6bdcff');
 ctx.restore();

 ctx.fillStyle='rgba(100,210,255,.48)';
 ctx.fillRect(
  t.direction===1?t.x-13:t.x+t.width,
  t.y+2,13,2
 );
}


function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
  rect(p.x,p.y,p.size,p.size,p.color);
 }
 ctx.globalAlpha=1;
}

function draw(){
 ctx.save();
 if(screenShake>0){
  ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
 }
 drawBackground();
 divers.forEach(drawDiver);
 enemies.forEach(drawEnemy);
 drawPlayer();
 torpedoes.forEach(drawTorpedo);
 enemyShots.forEach(drawEnemyShot);
 drawParticles();
 ctx.restore();
}

// ---------- اکسیژن ----------

function isAtSurface(){
 return player.y<=seaLine-player.height+4;
}

function updateOxygen(dt){
 const atSurface=isAtSurface()&&respawnTimer<=0;

 if(atSurface&&oxygen<100){
  const old=oxygen;
  oxygen=Math.min(100,oxygen+CFG.oxygenRefill*dt);
  if(oxygen>5)oxygenEmptyPlayed=false;
  startRefillSound();

  if(old<99&&oxygen>=99){
   showMessage('اکسیژن کامل شد!');
   stopRefillSound();
  }
 }else{
  stopRefillSound();
  if(!atSurface){
   oxygen=Math.max(0,oxygen-CFG.oxygenDrain*dt);
   if(oxygen<25){
    alarmTimer-=dt;
    if(alarmTimer<=0){alarmSound();alarmTimer=.85;}
   }else{alarmTimer=0;}
   if(oxygen<=0){
    if(!oxygenEmptyPlayed){oxygenEmptySound();oxygenEmptyPlayed=true;}
    damagePlayer();
   }
  }
 }

 $('oxygen-bar').style.width=oxygen+'%';
 $('oxygen-bar').style.background=
 oxygen<25?'#ed3525':oxygen<50?'#f5a623':'#e8e8e8';
}

// ---------- آسیب ----------

function damagePlayer(){
 if(invulnerable>0||respawnTimer>0||!active)return;

 lives--;
 $('lives').textContent=lives;
 createExplosion(player.x+player.width/2,player.y+player.height/2,'#fff04a','#ff3a19',65);
 playerExplosionSound();
 screenShake=17;
 player.vx=0;player.vy=0;
 oxygen=100;
 stopRefillSound();

 invulnerable=1.8;
 respawnTimer=1.1;
 showMessage('زیردریایی آسیب دید!');

 if(lives<=0)endGame();
}

// ---------- سختی مرحله ----------

function checkDifficulty(){
 if(score>=5000&&!boostApplied){
  boostApplied=true;
  CFG.maxSpeed*=1.08;
  CFG.acceleration*=1.08;
  CFG.torpedoSpeed*=1.08;
  CFG.fireInterval*=.96;
  showMessage('ENEMY SPEED INCREASED!');
  tone(420,760,.42,'triangle',.07);
 }
}

// ---------- به‌روزرسانی ----------

function update(dt){
 elapsed+=dt;

 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0)$('message').style.opacity=0;
 }

 if(invulnerable>0)invulnerable-=dt;

 if(respawnTimer>0){
  respawnTimer-=dt;
  if(respawnTimer<=0&&lives>0){
   player.x=65;
   player.y=seaLine+H*.25;
   player.vx=0;player.vy=0;
  }
 }else{
  let ix=joystickActive?joystickVector.x:0;
  let iy=joystickActive?joystickVector.y:0;

  ix=Math.max(-1,Math.min(1,ix+keyboardVector.x));
  iy=Math.max(-1,Math.min(1,iy+keyboardVector.y));

  const inputLength=Math.hypot(ix,iy);
  if(inputLength>1){ix/=inputLength;iy/=inputLength}

  if(Math.abs(ix)>.08||Math.abs(iy)>.08){
   player.vx+=ix*CFG.acceleration*dt;
   player.vy+=iy*CFG.acceleration*dt;
  }

  if(Math.abs(ix)>.12)player.direction=ix>0?1:-1;

  const friction=Math.pow(CFG.friction,dt*60);
  player.vx*=friction;
  player.vy*=friction;

  const speed=Math.hypot(player.vx,player.vy);
  if(speed>CFG.maxSpeed){
   player.vx=player.vx/speed*CFG.maxSpeed;
   player.vy=player.vy/speed*CFG.maxSpeed;
  }

  if(Math.abs(player.vx)<1)player.vx=0;
  if(Math.abs(player.vy)<1)player.vy=0;

  player.x+=player.vx*dt;
  player.y+=player.vy*dt;

  const topLimit=seaLine-player.height+3;
  if(player.y<topLimit){
   player.y=topLimit;
   player.vy=Math.max(0,player.vy);
  }

  if(player.y>floorLine-player.height-5){
   player.y=floorLine-player.height-5;
   player.vy=Math.min(0,player.vy);
  }

  if(player.x<5){player.x=5;player.vx=Math.max(0,player.vx)}
  if(player.x>W-player.width-5){
   player.x=W-player.width-5;
   player.vx=Math.min(0,player.vx);
  }

  updateOxygen(dt);

  if(fireHeld){
   fireTimer-=dt;
   if(fireTimer<=0){
    fireTorpedo();
    fireTimer=CFG.fireInterval;
   }
  }
 }

 enemyTimer+=dt;
 diverTimer+=dt;

 const enemyInterval=Math.max(1.15,2.65-score/22000)*(boostApplied?.9:1);
 if(enemyTimer>enemyInterval){
  spawnEnemy();
  enemyTimer=0;
 }
 if(diverTimer>5.2){
  spawnDiver();
  diverTimer=0;
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vx*=Math.pow(.96,dt*60);
  p.vy*=Math.pow(.96,dt*60);
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }

 // اژدرهای بازیکن
 for(let i=torpedoes.length-1;i>=0;i--){
  const t=torpedoes[i];
  t.x+=t.vx*dt;
  t.life-=dt;
  if(t.x>W+30||t.x<-30||t.life<=0)torpedoes.splice(i,1);
 }


 // گلوله‌های دشمن
 for(let i=enemyShots.length-1;i>=0;i--){
  const t=enemyShots[i];
  t.x+=t.vx*dt;t.y+=t.vy*dt;t.life-=dt;
  if(t.life<=0||t.x<-25||t.x>W+25||t.y<seaLine-35||t.y>floorLine+25){
   enemyShots.splice(i,1);continue;
  }
  const hitBox={x:t.x-7,y:t.y-4,width:14,height:8};
  if(respawnTimer<=0&&overlap(hitBox,player)){
   enemyShots.splice(i,1);
   damagePlayer();
  }
 }

 // غواصان
 for(let i=divers.length-1;i>=0;i--){
  const d=divers[i];
  d.x-=d.speed*dt;
  if(d.x+d.width<0){divers.splice(i,1);continue}

  if(respawnTimer<=0&&overlap(d,player)){
   divers.splice(i,1);
   score+=50;
   savedDivers++;
   saveSound();
   showMessage('غواص نجات پیدا کرد!');
   $('score').textContent=score;
   checkDifficulty();

   if(savedDivers>=6){
    savedDivers=0;
    lives++;
    $('lives').textContent=lives;
    showMessage('یک جان اضافه گرفتی!');
   }
   updateDiverIcons();
  }
 }

 // دشمنان
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];

  e.x+=e.speed*e.direction*dt;

  if(score>=3000){
   e.fireCooldown-=dt;
   if(e.fireCooldown<=0){
    const sx=e.x+e.width/2,sy=e.y+e.height/2;
    const dx=player.x+player.width/2-sx;
    const dy=player.y+player.height/2-sy;
    const length=Math.max(1,Math.hypot(dx,dy));
    const shotSpeed=205*(boostApplied?1.08:1);
    enemyShots.push({x:sx,y:sy,vx:dx/length*shotSpeed,vy:dy/length*shotSpeed,life:4});
    e.fireCooldown=2.0+Math.random()*1.4;
   }
  }

  if(respawnTimer<=0&&overlap(e,player)){
   enemies.splice(i,1);
   damagePlayer();
   continue;
  }

  if((e.direction===-1&&e.x+e.width<-20)||(e.direction===1&&e.x>W+20)){
   enemies.splice(i,1);
   continue;
  }

  for(let j=torpedoes.length-1;j>=0;j--){
   if(overlap(torpedoes[j],e)){
    createExplosion(e.x+e.width/2,e.y+e.height/2,'#ffffff','#d6d6d6',30);
    explosionSound();

    score+=e.type==='ship'?25:30;
    $('score').textContent=score;
    checkDifficulty();

    enemies.splice(i,1);
    torpedoes.splice(j,1);
    break;
   }
  }
 }

 if(screenShake>0)screenShake=Math.max(0,screenShake-dt*35);
}

// ---------- رابط کاربری ----------

function updateDiverIcons(){
 const box=$('divers');
 box.innerHTML='';
 for(let i=0;i<savedDivers;i++){
  const el=document.createElement('div');
  el.className='diver-icon';
  box.appendChild(el);
 }
}

function resetGame(){
 resize();
 enterFullscreen();
 stopRefillSound();

 score=0;lives=3;oxygen=100;savedDivers=0;alarmTimer=0;oxygenEmptyPlayed=false;
 elapsed=0;enemyTimer=0;diverTimer=0;
 fireTimer=0;fireHeld=false;
 boostApplied=false;

 CFG.acceleration=820;
 CFG.maxSpeed=225;
 CFG.torpedoSpeed=610;
 CFG.fireInterval=.30;
 enemyDirection=-1;

 enemies=[];torpedoes=[];enemyShots=[];
 divers=[];particles=[];

 player.x=65;
 player.y=seaLine+H*.25;
 player.vx=0;player.vy=0;
 player.direction=1;

 invulnerable=0;respawnTimer=0;screenShake=0;
 keyboardVector={x:0,y:0};

 joystickEnd();
 releaseFire();

 $('score').textContent='0';
 $('lives').textContent='3';
 $('game-over').style.display='none';
 $('start-screen').style.display='none';

 updateDiverIcons();
 $('oxygen-bar').style.width='100%';
 $('oxygen-bar').style.background='#e8e8e8';

 active=true;
 gameEnded=false;
 lastTime=performance.now();

 cancelAnimationFrame(window.gameAnimation);
 window.gameAnimation=requestAnimationFrame(gameLoop);
}

function endGame(){
 if(gameEnded)return;
 gameEnded=true;
 active=false;
 stopRefillSound();
 joystickEnd();
 releaseFire();
 $('final-score').textContent=score;
 $('game-over').style.display='flex';
}

function gameLoop(timestamp){
 if(!active)return;
 let dt=Math.min((timestamp-lastTime)/1000,.033);
 lastTime=timestamp;
 update(dt);
 draw();
 if(active)window.gameAnimation=requestAnimationFrame(gameLoop);
}

// ---------- دکمه‌ها ----------

$('start-btn').addEventListener('click',()=>{
 initAudio();
 tone(450,900,.25,'sine',.06);
 resetGame();
});

$('restart-btn').addEventListener('click',()=>{
 initAudio();
 resetGame();
});

$('exit-btn').addEventListener('click',()=>{
 stopRefillSound();
 if(window.Capacitor?.Plugins?.App){
  window.Capacitor.Plugins.App.exitApp();
 }else{
  $('game-over').style.display='none';
  $('start-screen').style.display='flex';
 }
});

// ---------- نمایش تمام‌صفحه ----------
async function enterFullscreen(){
 try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'});}catch(_){}
 try{if(screen.orientation?.lock)await screen.orientation.lock('landscape');}catch(_){}
}

// ---------- صفحه‌کلید ----------

const keysDown=new Set();

window.addEventListener('keydown',e=>{
 if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
 keysDown.add(e.key.toLowerCase());

 keyboardVector.x=
 (keysDown.has('arrowright')||keysDown.has('d')?1:0)-
 (keysDown.has('arrowleft')||keysDown.has('a')?1:0);

 keyboardVector.y=
 (keysDown.has('arrowdown')||keysDown.has('s')?1:0)-
 (keysDown.has('arrowup')||keysDown.has('w')?1:0);

 if(keyboardVector.x!==0)player.direction=keyboardVector.x>0?1:-1;

 if(e.key===' '&&active){
  initAudio();
  fireHeld=true;
  fireTimer=0;
 }
});

window.addEventListener('keyup',e=>{
 keysDown.delete(e.key.toLowerCase());

 keyboardVector.x=
 (keysDown.has('arrowright')||keysDown.has('d')?1:0)-
 (keysDown.has('arrowleft')||keysDown.has('a')?1:0);

 keyboardVector.y=
 (keysDown.has('arrowdown')||keysDown.has('s')?1:0)-
 (keysDown.has('arrowup')||keysDown.has('w')?1:0);

 if(e.key===' ')fireHeld=false;
});

window.addEventListener('blur',()=>{
 keysDown.clear();
 keyboardVector={x:0,y:0};
 releaseFire();
 joystickEnd();
});

document.addEventListener('contextmenu',e=>e.preventDefault());

draw();
</script>
