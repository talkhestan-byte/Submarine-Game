name: Build Game APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python image tools
        run: |
          python3 -m pip install --user Pillow

      - name: Check icon files
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os

          files = [
              "assets/icon-only.png",
              "assets/icon-foreground.png",
              "assets/icon-background.png"
          ]

          for file in files:
              if not os.path.isfile(file):
                  raise SystemExit(f"Missing icon file: {file}")

              img = Image.open(file).convert("RGBA")
              print(f"{file}: {img.size}")

              if img.width < 1024 or img.height < 1024:
                  raise SystemExit(
                      f"Icon must be at least 1024x1024: {file}"
                  )

          print("All icon files are valid.")
          PY

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/

          npm init -y

          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npm install --save-dev @capacitor/assets

      - name: Configure Capacitor
        run: |
          npx cap init "Submarine Game" com.iranianconcrete.submarine --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android

      - name: Verify generated Android icons
        run: |
          echo "Checking generated launcher icons..."
          find android/app/src/main/res -type f \
            \( -name "ic_launcher.png" -o -name "ic_launcher_foreground.png" \) \
            -print

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Submarine-Game-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
